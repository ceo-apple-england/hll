<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HALLOWEEN NIGHTMARE — Bước vào thế giới ma quái. Khi đồng hồ điểm nửa đêm, màn đêm thức giấc." />
  <meta name="theme-color" content="#050507" />
  <meta property="og:title" content="HALLOWEEN NIGHTMARE — ENTER THE DARKNESS" />
  <meta property="og:description" content="When the clock strikes midnight, the night comes alive." />
  <meta property="og:type" content="website" />
  <title>HALLOWEEN NIGHTMARE — ENTER THE DARKNESS</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050507'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23D10F2F'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23050507'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;600;700&family=Space+Mono:wght@400;700&family=Nosifer&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ============ INTRO SCREEN ============ -->
  <div id="intro" class="intro" aria-label="Màn hình mở đầu">
    <canvas id="intro-canvas" aria-hidden="true"></canvas>
    <div class="intro-content">
      <p class="intro-eyebrow">A HALLOWEEN EXPERIENCE</p>
      <h1 class="intro-title" id="intro-title" aria-label="Halloween Nightmare"></h1>
      <p class="intro-sub">THE NIGHT IS WAITING FOR YOU.</p>
      <button id="enter-btn" class="btn btn-primary btn-enter" type="button">ENTER THE DARKNESS</button>
    </div>
    <button id="skip-intro" class="btn btn-ghost btn-skip" type="button">SKIP INTRO</button>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="app-shell" class="app-shell hidden" aria-hidden="true">

    <header class="site-header">
      <a href="#/home" class="brand" aria-label="Halloween Nightmare — Trang chủ">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">NIGHTMARE</span>
      </a>

      <nav class="site-nav" aria-label="Điều hướng chính">
        <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-list">
          <span></span><span></span><span></span>
          <span class="sr-only">Mở menu</span>
        </button>
        <ul class="nav-list" id="nav-list">
          <li><a href="#/home" data-route="home">HOME</a></li>
          <li><a href="#/explore" data-route="explore">EXPLORE</a></li>
          <li><a href="#/house" data-route="house">HAUNTED HOUSE</a></li>
          <li><a href="#/forest" data-route="forest">FOREST</a></li>
          <li><a href="#/games" data-route="games">GAMES</a></li>
          <li><a href="#/secrets" data-route="secrets">SECRETS</a></li>
          <li><a href="#/gallery" data-route="gallery">GALLERY</a></li>
        </ul>
      </nav>

      <div class="header-tools">
        <button id="btn-sound" class="icon-btn" aria-label="Bật tắt âm thanh" aria-pressed="false" title="Âm thanh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 9v6h4l5 4V5L8 9H4z"/>
            <path id="sound-wave" d="M16.5 8.5a5 5 0 010 7M19 6a8 8 0 010 12" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" aria-label="Cài đặt" title="Cài đặt">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>
          </svg>
        </button>
        <button id="btn-fullscreen" class="icon-btn" aria-label="Toàn màn hình" title="Toàn màn hình">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="transition-overlay" id="transition-overlay" aria-hidden="true"></div>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <p>© <span id="year"></span> HALLOWEEN NIGHTMARE — For entertainment only.</p>
      <p class="footer-hint">Press <kbd>Esc</kbd> to close panels</p>
    </footer>
  </div>

  <!-- ============ SETTINGS PANEL ============ -->
  <aside id="settings-panel" class="settings-panel" aria-hidden="true" aria-labelledby="settings-title" role="dialog">
    <div class="settings-card">
      <header class="settings-head">
        <h2 id="settings-title">SETTINGS</h2>
        <button class="icon-btn" id="settings-close" aria-label="Đóng cài đặt">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="settings-body">
        <fieldset>
          <legend>SOUND</legend>
          <label class="switch"><input type="checkbox" id="s-music" checked><span>MUSIC</span></label>
          <label class="switch"><input type="checkbox" id="s-sfx" checked><span>SFX</span></label>
          <label class="slider-label">MASTER VOLUME <output id="s-master-val">70</output>%
            <input type="range" id="s-master" min="0" max="100" value="70"></label>
          <label class="slider-label">MUSIC VOLUME <output id="s-music-vol-val">30</output>%
            <input type="range" id="s-music-vol" min="0" max="100" value="30"></label>
          <label class="slider-label">SFX VOLUME <output id="s-sfx-vol-val">60</output>%
            <input type="range" id="s-sfx-vol" min="0" max="100" value="60"></label>
        </fieldset>
        <fieldset>
          <legend>EXPERIENCE</legend>
          <label class="switch"><input type="checkbox" id="s-reduce-motion"><span>REDUCE MOTION</span></label>
          <label class="switch"><input type="checkbox" id="s-jumpscare"><span>DISABLE JUMPSCARES</span></label>
          <label class="switch"><input type="checkbox" id="s-particles" checked><span>PARTICLE EFFECTS</span></label>
          <label class="switch"><input type="checkbox" id="s-ambient" checked><span>AMBIENT EVENTS</span></label>
        </fieldset>
        <fieldset>
          <legend>QUALITY</legend>
          <label class="radio-row"><input type="radio" name="quality" value="low"><span>LOW</span></label>
          <label class="radio-row"><input type="radio" name="quality" value="medium"><span>MEDIUM</span></label>
          <label class="radio-row"><input type="radio" name="quality" value="high"><span>HIGH</span></label>
        </fieldset>
        <button class="btn btn-primary w-full" id="settings-save" type="button">SAVE & CLOSE</button>
      </div>
    </div>
  </aside>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="js/settings.js"></script>
  <script src="js/audio-manager.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/games.js"></script>
  <script src="js/house.js"></script>
  <script src="js/forest.js"></script>
  <script src="js/secrets.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
